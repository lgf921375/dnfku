<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>召唤师普攻 · S8 统一对照</title><style>
/* OFFLINE_FONT */
*{box-sizing:border-box}body{margin:0;background:#151625;color:#eee5f4;font-family:MotionFont,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0 0 5px}p{font-size:13px;line-height:1.7;color:#b9abc8;margin:4px 0 12px}.badge{font-size:12px;background:#3b3051;padding:7px 11px;border-radius:20px;white-space:nowrap}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #4b3d62;border-radius:14px;background:#24203b}nav,.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button{font:inherit;font-size:14px;min-height:44px;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:10px;padding:9px 16px;cursor:pointer;touch-action:none}button.primary{background:#ab88d7;color:#1c142a;font-weight:700}select{font:inherit;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:8px;min-height:36px}button:focus-visible,select:focus-visible{outline:2px solid #ebd7ff}label{font-size:13px;display:flex;align-items:center;gap:8px}input[type=range]{width:180px;accent-color:#bc9ce9}#status{font-size:13px;color:#d6c1ed;min-height:23px;margin:12px 0 5px}.foot{margin-top:16px;border-top:1px solid #443653;padding-top:12px}a{color:#ccb0ef}details{margin-top:12px}summary{cursor:pointer;font-size:13px;color:#beaecb}.comparison{display:flex;align-items:center;gap:10px;margin:10px 0}.comparison label{flex-shrink:0}.comparison select{min-height:44px;padding:6px 8px;max-width:100%}#comparisonHint{margin:0;font-size:12px;line-height:1.5;flex:1}@media(max-width:600px){main{padding:12px}h1{font-size:18px}header{align-items:flex-start}.badge{font-size:10px}button{padding:8px 12px}nav{gap:6px}.comparison{flex-wrap:wrap;gap:5px}.comparison label{width:100%}.comparison select{flex:1;min-width:0}#comparisonHint{width:100%}}
@media(orientation:landscape) and (max-height:500px){main{padding:8px}header{margin-bottom:6px}header h1{font-size:18px}header p{display:none}.badge{font-size:11px;padding:5px 10px}canvas{width:min(100%,calc((100svh - 205px)*16/9));margin-inline:auto;border-radius:10px}#status{margin:6px 0 4px}nav{margin-top:6px}.comparison{margin:5px 0;gap:8px}.comparison select{font-size:12px}.comparison label{font-size:12px}#comparisonHint{font-size:11px;line-height:1.3}}
</style></head><body><main><header><div><h1>召唤师本人 · 普通攻击</h1><p>选一个场景，直接比较攻击与受击反馈</p></div><span class="badge">S8 · 统一对照</span></header><div class="comparison"><label for="comparison">对照选择 <select id="comparison" aria-describedby="comparisonHint"></select></label><p id="comparisonHint" aria-live="polite"></p></div><canvas id="stage" width="960" height="540"></canvas>
<div id="status" aria-live="polite">等待输入</div><nav><button id="attack" class="primary">普通攻击 · X</button><button id="replay">播放所选对照</button><button id="reset">重来</button><button id="face">转身</button><button id="record">录制动作</button></nav>
<div class="tools"><label>手动状态 <select id="scene"><option value="standing">站立</option><option value="air">预置浮空</option><option value="down">预置倒地</option><option value="rise">预置起身</option></select></label><label><input type="checkbox" id="pk">PK角色对照</label><label><input type="checkbox" id="empty">空挥</label><label><input type="checkbox" id="feedback" checked>命中反馈</label><label><input type="checkbox" id="sound">声音</label><label><input type="checkbox" id="lane">错位目标</label><label><input type="checkbox" id="rig">查看骨架</label><label><input type="checkbox" id="slow">慢放 0.25×</label></div>
<details><summary>逐帧查看</summary><div class="tools"><label>参考帧 <input id="frame" type="range" min="0" max="30" step="1" value="0"><output id="frameLabel">0</output></label><button id="resume">恢复操作</button></div><div class="tools"><label><input type="checkbox" id="outline">轮廓接触试验</label><label>景深微调 <input id="depth" type="range" min="-9" max="9" step="1" value="0"></label><button id="edge">接触边缘对照</button><label><input type="checkbox" id="fragile">低血量对照</label><label><input type="checkbox" id="armor">霸体对照</label><label><input type="checkbox" id="protect">PK保护试验（候选参数）</label></div></details>
<p class="foot">选择对照场景后，点“播放所选对照”；“重来”保留选择，手动调节显示“自定义”。按 X 或长按攻击键连贯出招，A / D 移动。<a href="https://www.bilibili.com/video/BV1vDx1zKEKg/" target="_blank" rel="noopener">空挥参考：19.167–20.167 秒</a>。动作按空挥片段估计；命中反馈参数为试验候选，可预置目标浮空、倒地状态对照；普攻需实际接触才命中。默认矩形接触；可开启轮廓试验，对照边缘接触；受击姿态与PK保护参数尚未对齐原版。</p></main><script>
/* SUMMONER_MODULES */
const motion=new SummonerVictimS7(),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const lab={motion,draw(){drawSummonerVictimS7(ctx,motion,{rig:document.querySelector('#rig').checked});},samples:[]};window.summonerLab=lab;
const button=id=>document.getElementById(id),keys=new Set();
// Each selection is a complete fixture. Display preferences (sound/slow/rig)
// are independent and survive switching; combat controls never leak across it.
const comparisonDefaults={scene:'standing',pk:false,empty:false,feedback:true,lane:false,outline:false,depth:0,fragile:false,armor:false,protect:false};
const comparisonPresets=[
 {id:'standing',group:'基础反馈',label:'站立受击 · 普通怪物',hint:'三段接触后恢复站立。',settings:{}},
 {id:'empty',group:'基础反馈',label:'空挥 · 只看本人动作',hint:'目标隐藏，仅播放三段动作。',settings:{empty:true}},
 {id:'player',group:'基础反馈',label:'站立受击 · PK角色',hint:'角色目标；保护试验关闭。',settings:{pk:true}},
 {id:'no-feedback',group:'基础反馈',label:'站立受击 · 关闭反馈',hint:'接触仍扣血，关闭短停、硬直与火花。',settings:{feedback:false}},
 {id:'air',group:'被攻击者',label:'预置浮空 · 接触后下落',hint:'目标起始已浮空；不代表普攻能挑起。',settings:{scene:'air'}},
 {id:'down',group:'被攻击者',label:'倒地追击 · 连续两套',hint:'连续两套，观察低位接触与扫地接续。',settings:{scene:'down'},cycles:2},
 {id:'rise',group:'被攻击者',label:'普通起身 · 受击打断',hint:'从起身姿态开始，观察接触后的打断。',settings:{scene:'rise'}},
 {id:'armor',group:'被攻击者',label:'站立霸体 · 仍然扣血',hint:'保留命中短停，观察霸体不产生普通硬直。',settings:{armor:true}},
 {id:'armor-rise',group:'被攻击者',label:'霸体起身 · 不中断',hint:'起身带霸体，接触扣血但不打断起身。',settings:{scene:'rise',armor:true}},
 {id:'air-death',group:'死亡与保护',label:'浮空致死 · 下落倒地',hint:'起始血量5，观察致死短停后下落。',settings:{scene:'air',fragile:true}},
 {id:'down-death',group:'死亡与保护',label:'倒地致死 · 保持低位',hint:'起始血量5，第三段低位接触后保持倒地。',settings:{scene:'down',fragile:true}},
 {id:'pk-protection',group:'死亡与保护',label:'PK倒地保护 · 连续两套',hint:'连续两套触发候选保护；阈值尚未对齐原版。',settings:{scene:'down',pk:true,protect:true},cycles:2},
 {id:'edge-rectangle',group:'接触位置',label:'接触边缘 · 默认矩形',hint:'定格第11帧的几何对照；矩形在边缘命中。',settings:{},edge:true},
 {id:'edge-outline',group:'接触位置',label:'接触边缘 · 轮廓试验',hint:'相同定格位置，轮廓候选打空；不证明原版规则。',settings:{outline:true},edge:true},
 {id:'depth-front',group:'接触位置',label:'景深 +9 · 接触与火花',hint:'观察目标偏移后，接触处与火花是否一致。',settings:{depth:9}},
 {id:'depth-back',group:'接触位置',label:'景深 −9 · 接触与火花',hint:'观察另一侧偏移后的接触与火花。',settings:{depth:-9}},
 {id:'depth-miss',group:'接触位置',label:'景深错位 · 无接触',hint:'目标错位24，观察挥杖不造成伤害。',settings:{lane:true}}
];
for(const group of new Set(comparisonPresets.map(p=>p.group))){const optgroup=document.createElement('optgroup');optgroup.label=group;for(const p of comparisonPresets.filter(p=>p.group===group)){const option=new Option(p.label,p.id);optgroup.append(option);}button('comparison').append(optgroup);}
button('comparison').append(new Option('自定义 · 手动调节','custom'));
const selectedComparison=()=>comparisonPresets.find(p=>p.id===button('comparison').value);
function comparisonHint(){const p=selectedComparison();button('comparisonHint').textContent=p?p.hint+' 点播放开始。':'当前为手动设置；播放一套，重来保留设置。';}
function cancelComparison(){lab.comparisonRun=null;motion.replay=false;keys.clear();motion.setHeld(false);motion.queue=false;}
function resetComparison(){cancelComparison();motion.scenario=button('scene').value;motion.fragile=button('fragile').checked;motion.reset();applyTarget();audioCursor=0;button('frame').value='0';button('frameLabel').value='0';lab.draw();}
function selectComparison(){const p=selectedComparison();if(!p){comparisonHint();return;}
 const settings={...comparisonDefaults,...p.settings};for(const [id,value] of Object.entries(settings)){if(['scene','depth'].includes(id))button(id).value=String(value);else button(id).checked=value;}
 resetComparison();comparisonHint();}
function customComparison(){button('comparison').value='custom';resetComparison();comparisonHint();}
function playComparison(){const p=selectedComparison();resetComparison();audioReady();
 if(p?.edge){motion.playContactEdge();applyTarget();button('frame').value='11';button('frameLabel').value='11';lab.draw();return;}
 motion.playReference();applyTarget();audioCursor=0;lab.comparisonRun={preset:p?.id??'custom',cycles:p?.cycles??1,completed:0,done:false};}
button('comparison').onchange=selectComparison;
let audioContext=null,audioCursor=0;
lab.audio={played:0,scheduled:[],error:null};
function audioReady(){if(!button('sound').checked)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(e=>{lab.audio.error=e.message;});}catch(e){lab.audio.error=e.message;}}
function pumpAudio(){while(audioCursor<motion.events.length){const e=motion.events[audioCursor++];if(e.type!=='impact'||!e.feedbackEnabled||!button('sound').checked||audioContext?.state!=='running')continue;
 const samples=summonerImpactSamples(e.stage,audioContext.sampleRate),buffer=audioContext.createBuffer(1,samples.length,audioContext.sampleRate);buffer.copyToChannel(samples,0);const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);source.onended=()=>source.disconnect();source.start();lab.audio.played++;lab.audio.scheduled.push({attackId:e.attackId,stage:e.stage,samples:samples.length});}
 lab.audio.contextState=audioContext?.state??'not-created';}
function applyTarget(){motion.target.present=!button('empty').checked;motion.target.lane=button('lane').checked?24:+button('depth').value;motion.setFeedbackEnabled(button('feedback').checked);motion.setTargetKind(button('pk').checked?'player':'monster');motion.setArmored(button('armor').checked);motion.setPKProtection(button('protect').checked);motion.setLegacyContact(!button('outline').checked);}
for(const id of ['scene','fragile','pk','empty','lane','feedback','armor','protect','outline'])button(id).onchange=customComparison;
button('depth').oninput=customComparison;
button('edge').onclick=()=>{button('comparison').value=button('outline').checked?'edge-outline':'edge-rectangle';selectComparison();playComparison();};
button('sound').onchange=audioReady;

button('attack').addEventListener('pointerdown',e=>{e.preventDefault();cancelComparison();audioReady();button('attack').setPointerCapture(e.pointerId);motion.setHeld(true);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])button('attack').addEventListener(event,()=>motion.setHeld(false));
button('replay').onclick=playComparison;button('reset').onclick=resetComparison;button('face').onclick=()=>{cancelComparison();motion.face(-motion.facing);motion.placeTargetInFront();};
button('frame').oninput=e=>{cancelComparison();motion.seekFrame(+e.target.value);button('frameLabel').value=e.target.value;lab.draw();};
button('resume').onclick=resetComparison;
addEventListener('keydown',e=>{if(['INPUT','BUTTON','SELECT'].includes(e.target.tagName))return;if(['x','a','d','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!keys.has(e.key)&&e.key==='x'){cancelComparison();audioReady();motion.setHeld(true);}keys.add(e.key);}});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='x')motion.setHeld(false);});
const release=cancelComparison;addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
let last=null,recorder=null,chunks=[],stream=null;
button('record').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();return;}
 try{stream=canvas.captureStream(30);const mime=['video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType})),a=document.createElement('a');a.href=url;a.download='summoner-s8-canvas.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);stream.getTracks().forEach(t=>t.stop());button('record').textContent='录制动作';};recorder.start(250);button('record').textContent='停止并下载';}catch(e){button('status').textContent='录制不可用：'+e.message;}};
function raf(now){const dt=summonerFrameDelta(now,last);last=now;const slow=button('slow').checked?.25:1;
 const dir=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);if(dir)motion.move(dir*95*dt*slow);
 motion.tick(dt*slow);const run=lab.comparisonRun;if(run&&!run.done){const completed=motion.events.filter(e=>e.type==='reference-done').length;if(completed>run.completed){run.completed=completed;if(completed<run.cycles){motion.replay=true;motion.start(0);}else run.done=true;}}
 pumpAudio();lab.draw();if(lab.victimFrames&&lab.victimFrames.length<1000)lab.victimFrames.push({phase:motion.targetPose().phase,pose:motion.targetPose(),stop:motion.target.stop,time:motion.feedbackTime});const a=motion.action;button('status').textContent=motion.paused?'逐帧预览 · 按“恢复操作”继续':a?['首段 · 前伸','第二段 · 斜向上挥','末段 · 空中收杖'][a.stage]:'等待输入 · X / 长按攻击';button('status').textContent+=` · 命中 ${motion.hitCount} · ${{idle:'站立',impact:'冲击',hold:'硬直',recover:'恢复','air-rise':'上升','air-fall':'下落','air-hit':'空中受击',down:'倒地','down-hit':'倒地受击',landing:'落地',rise:'起身','defeat-hit':'致死受击','defeat-fall':'死亡下落','defeat-down':'死亡倒地'}[motion.targetPose().phase]}`;
 if(lab.samples.length<5000)lab.samples.push({wall:now,time:motion.time,feedbackTime:motion.feedbackTime,stop:motion.attackerStop,targetX:motion.target.x,targetAge:motion.target.reaction?.age??null,stage:a?.stage??null,frame:a?.frame??null,held:motion.held});requestAnimationFrame(raf);}
selectComparison();requestAnimationFrame(raf);
</script></body></html>
