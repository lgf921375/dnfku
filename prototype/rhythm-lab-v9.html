<aside id="panel"><b>手感实验参数</b><label>攻击者顿帧 <input id="attackerStop" type="range" min="0" max="2" step=".1" value="1"><output id="attackerStopValue">1×</output></label><label>受击者顿帧 <input id="victimStop" type="range" min="0" max="2" step=".1" value="1"><output id="victimStopValue">1×</output></label><label>浮空重力 <input id="gravity" type="range" min="12" max="36" step="1" value="22"><output id="gravityValue">22</output></label><label>击退强度 <input id="knockback" type="range" min="0" max="2" step=".1" value="1"><output id="knockbackValue">1×</output></label><label>倒地时间 <input id="downTime" type="range" min=".4" max="1.6" step=".1" value=".9"><output id="downTimeValue">0.9s</output></label><label>显示碰撞盒 <input id="boxes" type="checkbox"></label><p>均为原创实验值。普攻三段基础顿帧45 / 55 / 85ms；上挑70ms。绿色为攻击范围，金色为受击范围。</p></aside><script>
/** Original isolated combat model. NOT upstream DNF. Values are test-only design choices. */
const SETTINGS = Object.freeze({
  "gravity": 22,
  "launchVelocity": 10.5,
  "airTapVelocity": 5.5,
  "knockdownSeconds": 0.9,
  "comboWindowSeconds": 1.6,
  "airHitLimit": 4,
  "groundHitLimit": 3,
  "totalHitLimit": 7,
  "protectedInvulnerabilitySeconds": 0.6,
  "fixedStep": 0.008333333333333333,
  "minHitIntervalSeconds": 0.09,
  "hitstopSeconds": 0.04,
  "groundBounceVelocity": 0,
  "groundBounceCount": 1
});
const ATTACKS = Object.freeze({
  "launcher": {
    "x0": 0,
    "x1": 1.5,
    "y0": 0.05,
    "y1": 1.85,
    "allowed": [
      "idle",
      "airborne"
    ],
    "effect": "launch"
  },
  "airTap": {
    "x0": 0,
    "x1": 1.5,
    "y0": 0.65,
    "y1": 3.5,
    "allowed": [
      "airborne"
    ],
    "effect": "airtap"
  },
  "groundSweep": {
    "x0": 0,
    "x1": 1.5,
    "y0": 0,
    "y1": 0.4,
    "allowed": [
      "down"
    ],
    "effect": "ground"
  },
  "highSlash": {
    "x0": 0,
    "x1": 1.5,
    "y0": 0.6,
    "y1": 1.65,
    "allowed": [
      "idle",
      "airborne"
    ],
    "effect": "none"
  }
});
class CombatArena {
  constructor(overrides = {}) {
    this.cfg = {...SETTINGS, ...overrides};
    this.time=0; this.accumulator=0; this.playerX=0; this.enemyX=0.8;
    this.state="idle"; this.y=0; this.vy=0; this.downRemaining=0; this.invulnerabilityRemaining=0;
    this.hitstopRemaining=0; this.bounceRemaining=0;
    this.airHits=0; this.groundHits=0; this.totalHits=0; this.comboExpires=-Infinity; this.lastHitTime=-Infinity;
    this.events=[];
  }
  snapshot() {
    return {time:this.time,state:this.state,enemyX:this.enemyX,y:this.y,vy:this.vy,
      downRemaining:this.downRemaining,invulnerabilityRemaining:this.invulnerabilityRemaining,
      hitstopRemaining:this.hitstopRemaining,bounceRemaining:this.bounceRemaining,
      airHits:this.airHits,groundHits:this.groundHits,totalHits:this.totalHits};
  }
  resetCombo() { this.airHits=0; this.groundHits=0; this.totalHits=0; this.comboExpires=-Infinity; }
  record(type,detail) {
    const event={time:Number(this.time.toFixed(5)),type,...detail};
    this.events.push(event);return event;
  }
  overlap(a,b) {
    return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
  }
  enemyBox() {
    if (this.state==="down") return {x0:this.enemyX-0.54,x1:this.enemyX+0.54,y0:0,y1:0.32};
    return {x0:this.enemyX-0.34,x1:this.enemyX+0.34,y0:this.y,y1:this.y+1.8};
  }
  attackBox(def) {return {x0:this.playerX+def.x0,x1:this.playerX+def.x1,y0:def.y0,y1:def.y1};}
  forcedStand(reason) {
    this.state="invulnerable";this.y=0;this.vy=0;this.downRemaining=0;
    this.invulnerabilityRemaining=this.cfg.protectedInvulnerabilitySeconds; this.hitstopRemaining=0; this.bounceRemaining=0;
    this.record("forced-stand",{reason,airHits:this.airHits,groundHits:this.groundHits,totalHits:this.totalHits});
    this.resetCombo();
  }
  hit(name, {definition} = {}) {
    const def=definition ?? ATTACKS[name];
    if(!def) throw new Error("Unknown attack: "+name);
    if(this.state==="invulnerable") return this.record("blocked",{attack:name,reason:"protected-invulnerability"});
    if(!def.allowed.includes(this.state)) return this.record("blocked",{attack:name,reason:"invalid-target-state"});
    if(!this.overlap(this.attackBox(def),this.enemyBox())) return this.record("blocked",{attack:name,reason:"aabb-miss"});
    if(this.time-this.lastHitTime < this.cfg.minHitIntervalSeconds-1e-9) return this.record("blocked",{attack:name,reason:"hit-cadence"});
    if(this.time > this.comboExpires) this.resetCombo();
    this.totalHits++;this.lastHitTime=this.time;this.comboExpires=this.time+this.cfg.comboWindowSeconds;
    if(def.effect==="launch") {
      this.airHits++;this.state="airborne";this.y=Math.max(this.y,0.01);this.vy=this.cfg.launchVelocity;
      this.bounceRemaining=this.cfg.groundBounceCount;
    }else if(def.effect==="airtap") {
      this.airHits++;this.vy=this.cfg.airTapVelocity;
    }else if(def.effect==="ground") {
      this.groundHits++;this.downRemaining=this.cfg.knockdownSeconds;
    }else if(this.state==="airborne") {
      this.airHits++;
    }
    const event=this.record("hit",{attack:name,state:this.state});
    this.hitstopRemaining=Math.max(0,this.cfg.hitstopSeconds);
    if(this.airHits>=this.cfg.airHitLimit || this.groundHits>=this.cfg.groundHitLimit || this.totalHits>=this.cfg.totalHitLimit) {
      this.forcedStand(this.airHits>=this.cfg.airHitLimit?"air-limit":this.groundHits>=this.cfg.groundHitLimit?"ground-limit":"total-limit");
    }
    return event;
  }
  fixedTick() {
    const dt=this.cfg.fixedStep;
    this.time+=dt;
    // A confirmed hit pauses physical/timer progression without stopping monotonic event time.
    if(this.hitstopRemaining>0) {
      this.hitstopRemaining=Math.max(0,this.hitstopRemaining-dt);
      return;
    }
    if(this.state==="airborne"){
      this.vy-=this.cfg.gravity*dt;
      this.y+=this.vy*dt;
      if(this.y<=0){
        this.y=0;
        if(this.bounceRemaining>0 && this.cfg.groundBounceVelocity>0.01 && this.vy<0){
          this.vy=this.cfg.groundBounceVelocity;
          this.bounceRemaining--;
          this.record("ground-bounce",{velocity:this.vy,bouncesLeft:this.bounceRemaining});
        } else {
          this.vy=0;this.state="down";this.downRemaining=this.cfg.knockdownSeconds;
          this.record("landed",{downRemaining:this.downRemaining});
        }
      }
    }else if(this.state==="down"){
      this.downRemaining=Math.max(0,this.downRemaining-dt);
      if(this.downRemaining<=0){this.state="idle";this.record("ordinary-stand",{});}
    }else if(this.state==="invulnerable"){
      this.invulnerabilityRemaining=Math.max(0,this.invulnerabilityRemaining-dt);
      if(this.invulnerabilityRemaining<=0){this.state="idle";this.record("protection-ended",{});}
    }
    if(this.state==="idle"&&this.time>this.comboExpires) this.resetCombo();
  }
  tick(seconds) {
    if(!Number.isFinite(seconds)||seconds<0||seconds>5) throw new RangeError("tick seconds must be 0..5");
    this.accumulator+=seconds;
    while(this.accumulator + 1e-10 >= this.cfg.fixedStep){
      this.accumulator-=this.cfg.fixedStep;
      if(this.accumulator < 0) this.accumulator=0;
      this.fixedTick();
    }
    return this.snapshot();
  }
}

/** Original V4 input-and-animation time-line laboratory. No upstream code or DNF assets.
 * Attack windup/active/recovery times below are experimental, not official DNF values.
 * The V3 CombatArena remains the authoritative victim physics and hit validator.
 */

const ACTION_FRAMES = Object.freeze({
  launcher: Object.freeze({ startup:0.10, active:0.07, recovery:0.18 }),
  airTap: Object.freeze({ startup:0.06, active:0.07, recovery:0.13 }),
  groundSweep: Object.freeze({ startup:0.07, active:0.06, recovery:0.16 }),
  highSlash: Object.freeze({ startup:0.09, active:0.06, recovery:0.18 })
});
const ACTION_SETTINGS = Object.freeze({ inputBufferSeconds:0.20, bilateralHitstop:true });

class CombatActionController {
  constructor({ arena, actionSettings, frames } = {}) {
    this.arena = arena ?? new CombatArena();
    this.cfg = { ...ACTION_SETTINGS, ...actionSettings };
    this.frames = { ...ACTION_FRAMES, ...frames };
    this.time = 0;
    this.accumulator = 0;
    this.actionTime = 0;
    this.action = null;
    this.buffer = null;
    this.attackerHitstopRemaining = 0;
    this.events = [];
  }
  get phase() { return this.action?.phase ?? 'idle'; }
  get actionName() { return this.action?.name ?? null; }
  snapshot() { return {
    time:this.time, actionTime:this.actionTime, phase:this.phase, action:this.actionName,
    buffered:this.buffer?.name ?? null, attackerHitstopRemaining:this.attackerHitstopRemaining,
    target:this.arena.snapshot()
  }; }
  record(type, fields={}) { const e={type, time:Number(this.time.toFixed(5)), ...fields}; this.events.push(e); return e; }
  /** Inputs begin their STARTUP animation immediately, never apply instant damage. */
  press(name) {
    if (!Object.hasOwn(ATTACKS,name) || !this.frames[name]) throw new RangeError(`unknown action ${name}`);
    if (!this.action) { this.start(name); return this.record('input-started',{name}); }
    if (this.cfg.inputBufferSeconds<=0) return this.record('input-rejected',{name,reason:'busy'});
    // Replacement policy: the most recent input owns the one-slot buffer.
    this.buffer={ name, expiresAt:this.actionTime+this.cfg.inputBufferSeconds };
    return this.record('input-buffered',{name,phase:this.phase});
  }
  start(name) {
    const f=this.frames[name];
    for (const k of ['startup','active','recovery']) {
      if (!Number.isFinite(f[k]) || f[k]<0) throw new RangeError(`bad ${k} duration`);
    }
    this.action={name,phase:'startup',elapsed:0,impactDone:false};
    this.record('phase',{name,phase:'startup'});
  }
  applyImpact() {
    if (!this.action || this.action.impactDone) return;
    this.action.impactDone=true;
    const result=this.arena.hit(this.action.name);
    this.record('impact',{name:this.action.name,result:result.type,reason:result.reason??null});
    if (result.type==='hit') {
      const period=this.arena.hitstopRemaining;
      if (this.cfg.bilateralHitstop) this.attackerHitstopRemaining=period;
    }
  }
  nextPhase() {
    if (!this.action) return;
    const a=this.action;
    if (a.phase==='startup') {
      a.phase='active';a.elapsed=0;
      this.record('phase',{name:a.name,phase:'active'});
      this.applyImpact();
    } else if (a.phase==='active') {
      a.phase='recovery';a.elapsed=0;
      this.record('phase',{name:a.name,phase:'recovery'});
    } else {
      this.record('action-end',{name:a.name});
      this.action=null;
      if (this.buffer) {
        const pending=this.buffer;this.buffer=null;
        if (this.actionTime <= pending.expiresAt+1e-9) {
          this.start(pending.name);
          this.record('input-consumed',{name:pending.name});
        } else this.record('input-expired',{name:pending.name});
      }
    }
  }
  fixedTick() {
    const dt=this.arena.cfg.fixedStep;
    this.time+=dt;
    // Both channels always share a monotonic simulation clock.
    const frozen=this.cfg.bilateralHitstop && this.attackerHitstopRemaining>0;
    this.arena.tick(dt);
    if (frozen) {
      this.attackerHitstopRemaining=Math.max(0,this.attackerHitstopRemaining-dt);
      return;
    }
    this.attackerHitstopRemaining=0;
    this.actionTime+=dt;
    if (!this.action) return;
    // Each fixed tick may cross a single phase boundary: no double-hit at phase edges.
    const maxStep=this.frames[this.action.name][this.action.phase];
    this.action.elapsed+=dt;
    if (this.action.elapsed+1e-9>=maxStep) this.nextPhase();
  }
  tick(seconds) {
    if (!Number.isFinite(seconds)||seconds<0||seconds>5) throw new RangeError('invalid tick duration');
    this.accumulator+=seconds;
    const dt=this.arena.cfg.fixedStep;
    while(this.accumulator+1e-10>=dt) {
      this.accumulator-=dt;
      if (this.accumulator<0)this.accumulator=0;
      this.fixedTick();
    }
    return this.snapshot();
  }
}

/** Original V5 action-interruption policy. No DNF resources or damage formulas.
 * Super armor prevents an ACTION interruption only; it is not damage immunity.
 */

const INTERRUPT_SETTINGS = Object.freeze({
  cancelEnabled: true,
  cancelRecoveryAfter: 0.10,
  cancelRules: Object.freeze({
    launcher: ['airTap'],
    airTap: ['launcher'],
    groundSweep: ['launcher'],
    highSlash: []
  }),
  armoredActions: ['launcher']
});

class CombatInterruptController extends CombatActionController {
  constructor({ interruptSettings, ...options } = {}) {
    super(options);
    this.policy = { ...INTERRUPT_SETTINGS, ...interruptSettings };
    if (!Number.isFinite(this.policy.cancelRecoveryAfter) || this.policy.cancelRecoveryAfter < 0)
      throw new RangeError('cancelRecoveryAfter must be a finite nonnegative duration');
  }
  get armored() {
    return this.phase === 'active' && this.policy.armoredActions.includes(this.actionName);
  }
  canCancelInto(name) {
    return !!this.action && this.policy.cancelEnabled && this.phase === 'recovery' &&
      this.action.elapsed + 1e-9 >= this.policy.cancelRecoveryAfter &&
      (this.policy.cancelRules[this.actionName] ?? []).includes(name);
  }
  press(name) {
    if (!Object.hasOwn(ATTACKS, name) || !this.frames[name]) throw new RangeError(`unknown action ${name}`);
    if (this.canCancelInto(name)) {
      const from = this.actionName;
      this.action = null;
      this.buffer = null; // never replay an outdated input after a cancel.
      this.record('action-canceled', { from, to: name });
      this.start(name);
      return this.record('cancel-input-started', { from, name });
    }
    return super.press(name);
  }
  /** Caller only reports a validated incoming hit; no HP/damage calculations here. */
  receiveHit({force=false}={}) {
    if (this.armored && !force) {
      return this.record('armor-resisted', { name:this.actionName, phase:this.phase });
    }
    if (!this.action) return this.record('incoming-hit-idle', {});
    const old = this.actionName;
    this.action = null;
    this.buffer = null;
    this.attackerHitstopRemaining = 0;
    return this.record('action-interrupted', { name:old, force:!!force });
  }
  snapshot() { return { ...super.snapshot(), armored:this.armored, cancelReady:this.policy.cancelEnabled && this.action !== null && this.phase==='recovery' && this.action.elapsed+1e-9 >= this.policy.cancelRecoveryAfter && (this.policy.cancelRules[this.actionName] ?? []).length > 0 }; }
}

/** Original V6 two-fighter laboratory. All damage/guard values are experimental. */

const DUEL_SKILLS = Object.freeze(Object.fromEntries(Object.entries(ATTACKS).map(([name, def]) => [name,
  Object.freeze({ damage: {launcher:18, airTap:10, groundSweep:8, highSlash:14}[name],
    hitstun:0.18, force:false, boxes:[Object.freeze({from:0, to:1, ...def})] })])));

class DuelActionController extends CombatInterruptController {
  // V4's single impact is replaced with continuous active-window checks by the duel.
  applyImpact() {}
  start(name) { super.start(name); this.action.contacts = new Set(); }
}

class CombatDuel {
  constructor({ settings={}, skills={}, frames, interruptSettings, bilateralHitstop=true, hp=200, geometricHits=false }={}) {
    this.settings={...SETTINGS,...settings};this.geometricHits=geometricHits;
    if (!Number.isFinite(this.settings.fixedStep) || this.settings.fixedStep<=0 || this.settings.fixedStep>0.1)
      throw new RangeError('invalid fixedStep');
    if (!Number.isFinite(hp) || hp<=0) throw new RangeError('invalid HP');
    this.skills={...DUEL_SKILLS,...skills};
    for (const s of Object.values(this.skills)) {

    const teal=f.id==='A',armor=teal?'#306b83':'#9a454c',highlight=teal?'#7ddbd9':'#e79886',cloth=teal?'#143149':'#482635',skin='#edbc99';
    const flash=game.effects.some(e=>e.type==='damage'&&e.target===f.id&&game.time-e.time<.05);
    if(flash){ctx.shadowColor='#fff3bd';ctx.shadowBlur=18;}
    const hip=[0,-65+p.crouch];
    const kneeBack=[-15-p.step*.45,-30+p.crouch*.3],footBack=[-22-p.step*.5,-4];
    const kneeFront=[15+p.step*.42,-29+p.crouch*.4],footFront=[23+p.step*.48,-3];
    limb(hip,kneeBack,15,'#273449');limb(kneeBack,footBack,13,'#172536');
    polygon([[footBack[0]-7,-15],[footBack[0]+6,-15],[footBack[0]+14,-3],[footBack[0]+12,0],[footBack[0]-11,0]],'#1c2c3c');
    ctx.save();ctx.translate(...hip);ctx.rotate(bodyAngle);ctx.translate(0,65);
    // Long asymmetric coat, curved torso, breast plate and scarf.
    const sway=Math.sin(f.poseTime*5)*4;
    ctx.beginPath();ctx.moveTo(-15,-129);ctx.bezierCurveTo(-37,-104,-37+sway,-60,-52+sway,-39);ctx.quadraticCurveTo(-26,-42,-7,-78);ctx.lineTo(8,-117);ctx.closePath();ctx.fillStyle=cloth;ctx.fill();ctx.strokeStyle='#0e1726';ctx.lineWidth=2;ctx.stroke();
    limb([-15,-119],[-31,-91],14,armor);limb([-31,-91],[-19,-76],11,skin);
    ctx.beginPath();ctx.moveTo(-17,-128);ctx.quadraticCurveTo(0,-139,19,-122);ctx.lineTo(12,-94);ctx.quadraticCurveTo(9,-80,-2,-71);ctx.lineTo(-19,-83);ctx.quadraticCurveTo(-26,-100,-17,-128);ctx.fillStyle=armor;ctx.fill();ctx.strokeStyle='#0b1525';ctx.stroke();
    polygon([[-14,-122],[8,-126],[14,-110],[4,-98],[-15,-104]],highlight);
    polygon([[-19,-85],[13,-87],[14,-76],[-20,-74]],'#392e30');polygon([[-3,-86],[5,-86],[5,-75],[-3,-75]],'#e3bd75');
    // Neck and profile with ear, cheek, chin and swept hair.
    limb([-1,-134],[1,-126],10,skin);
    ctx.beginPath();ctx.moveTo(-9,-151);ctx.quadraticCurveTo(2,-163,14,-151);ctx.lineTo(14,-140);ctx.lineTo(20,-135);ctx.lineTo(13,-132);ctx.quadraticCurveTo(11,-122,1,-126);ctx.lineTo(-10,-132);ctx.closePath();ctx.fillStyle=skin;ctx.fill();ctx.strokeStyle='#202332';ctx.stroke();
    polygon([[-15,-146],[-18,-157],[-9,-166],[2,-163],[13,-167],[19,-157],[17,-148],[6,-154],[-1,-144],[-9,-148],[-12,-135]],teal?'#d7e4dc':'#383040');
    ctx.strokeStyle='#30232d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,-140);ctx.lineTo(14,-141);ctx.stroke();
    polygon([[-12,-127],[11,-126],[12,-117],[-8,-116]],'#d8b376');
    polygon([[-11,-125],[-38,-131],[-53-sway,-119],[-24,-118]],teal?'#68c5cb':'#d67c69');
    // Elbow/hand are animated; blade and trails use this identical transform.
    const shoulder=[12,-120],elbow=[12+Math.cos(p.arm)*26,-120+Math.sin(p.arm)*26],hand=[elbow[0]+Math.cos(p.arm+.15)*24,elbow[1]+Math.sin(p.arm+.15)*24];
    limb(shoulder,elbow,14,armor);limb(elbow,hand,10,skin);polygon([[9,-129],[22,-128],[29,-114],[9,-110]],highlight);
    ctx.fillStyle='#3c3841';ctx.beginPath();ctx.arc(...hand,7,0,7);ctx.fill();
    if(a?.phase==='active'){
      for(let i=3;i>=1;i--)blade(...hand,p.blade-(a.name==='launcher'?-1: a.cut===1?-1:1)*i*.17,highlight,.09);
      ctx.save();ctx.translate(...hand);ctx.strokeStyle=highlight+'99';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,94,p.blade-.55,p.blade+.12);ctx.stroke();ctx.strokeStyle='#f5fff4cc';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    }
    blade(...hand,p.blade,flash?'#fff5bf':'#abc5d2');ctx.restore();
    limb(hip,kneeFront,16,'#30435a');limb(kneeFront,footFront,14,'#23364a');polygon([[footFront[0]-8,-16],[footFront[0]+6,-16],[footFront[0]+17,-5],[footFront[0]+17,0],[footFront[0]-10,0]],'#192b3e');
    polygon([[kneeFront[0]-7,kneeFront[1]-6],[kneeFront[0]+7,kneeFront[1]-6],[kneeFront[0]+6,kneeFront[1]+8],[kneeFront[0]-6,kneeFront[1]+8]],highlight);
    if(f.body.state==='invulnerable'){ctx.strokeStyle='#8ce2ffb0';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-80,41,88,0,0,7);ctx.stroke();}
    ctx.restore();
    if(debug){const b=f.body.enemyBox();ctx.strokeStyle='#ffd18b';ctx.lineWidth=1.5;ctx.strokeRect(sx(b.x0),floor-b.y1*90,(b.x1-b.x0)*90,(b.y1-b.y0)*90);ctx.fillStyle='#ffd18b';ctx.font='11px sans-serif';ctx.fillText('受击盒',sx(b.x0),floor-b.y1*90-5);for(const box of game.attackBoxes(f)){ctx.fillStyle='#69ffd728';ctx.strokeStyle='#69ffd7';ctx.fillRect(sx(box.x0),floor-box.y1*90,(box.x1-box.x0)*90,(box.y1-box.y0)*90);ctx.strokeRect(sx(box.x0),floor-box.y1*90,(box.x1-box.x0)*90,(box.y1-box.y0)*90);}}
  }
  for(const e of game.effects){const age=game.time-e.time,x=sx(e.x),floor=405+e.lane*34,y=e.impactY!==undefined?floor-e.impactY*90:floor-e.y*90-(e.type==='landing'?0:55);
    if(e.type==='landing'){ctx.globalAlpha=Math.max(0,1-age/.18);ctx.strokeStyle='#c9c0a9';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,20+age*140,3+age*8,0,0,7);ctx.stroke();ctx.globalAlpha=1;continue;}
    if(age<.18){ctx.save();ctx.translate(x,y);ctx.globalCompositeOperation='screen';const g=ctx.createRadialGradient(0,0,0,0,0,38);g.addColorStop(0,'#fff4ca');g.addColorStop(.2,'#ffd679');g.addColorStop(1,'#ffa54000');ctx.fillStyle=g;ctx.globalAlpha=1-age/.18;ctx.fillRect(-38,-38,76,76);ctx.strokeStyle=e.type==='guard'?'#84d9ff':'#fff3cb';for(let i=0;i<12;i++){const angle=i*2.4,len=(e.cut===2?55:35)*(1+age*4);ctx.lineWidth=i%2?1:3;ctx.beginPath();ctx.moveTo(Math.cos(angle)*8,Math.sin(angle)*8);ctx.lineTo(Math.cos(angle)*len,Math.sin(angle)*len);ctx.stroke();}ctx.restore();}
    ctx.globalAlpha=Math.max(0,1-age/.55);ctx.fillStyle='#ffe8b2';ctx.font='italic bold 25px sans-serif';ctx.fillText(e.type==='guard'?'BLOCK':String(e.damage),x-12,y-48-age*55);ctx.globalAlpha=1;
  }
  ctx.restore();
}

/** Demonstration uses only public inputs and ordinary physics, no state/HP injection. */
class RhythmDemo {
  constructor(game){this.game=game;this.phase='三段普通攻击';this.start=game.time;this.sent=0;this.done=false;this.lastHit=0;}
  update(){
    const g=this.game,a=g.fighter('A'),b=g.fighter('B'),t=g.time-this.start;
    const approach=()=>{const dx=b.body.enemyX-a.body.enemyX;g.setInput('A',Math.abs(dx)>1?Math.sign(dx):0,0);};
    if(this.phase==='三段普通攻击'){
      if(this.sent<3&&t>this.sent*.34+.05){g.basic();this.sent++;}
      if(t>3.1&&b.body.state==='idle'){this.phase='上挑浮空';this.sent=0;}
    }else if(this.phase==='上挑浮空'){
      approach();if(Math.abs(b.body.enemyX-a.body.enemyX)<1.1&&!a.controller.action){g.clearInputs();g.press('A','launcher');this.phase='同键空中追击';this.sent=0;}
    }else if(this.phase==='同键空中追击'){
      // Wait for the target to fall into the SAME basic attack box. No high-air skill.
      if(this.sent===0&&b.body.state==='airborne'&&b.body.vy<0&&b.body.y<1.8&&!a.controller.action){g.basic();this.sent=1;}
      if(this.sent===1&&!a.controller.action&&b.body.state==='airborne'&&b.body.y<1.7){g.basic();this.sent=2;}
      if(b.body.state==='down'){this.phase='落地同键追击';this.sent=0;}
      if(b.body.state==='invulnerable'){this.phase='保护起身';this.done=true;}
    }else if(this.phase==='落地同键追击'){
      approach();if(!a.controller.action&&b.body.state==='down'&&Math.abs(b.body.enemyX-a.body.enemyX)<1.2){g.clearInputs();g.basic();this.sent++;}
      if(b.body.state==='invulnerable'){g.clearInputs();this.phase='保护起身';this.done=true;}
      else if(b.body.state==='idle'){g.clearInputs();this.phase='倒地追击未衔接，需复查';this.done=true;}
    }
  }
}

let demo=null,debugBoxes=false;
let game=new CombatRhythm(),last=0,holdAttack=false,repeatAt=0,stickPointer=null,muted=true,audio=null,eventIndex=0,paused=false;
const $=id=>document.getElementById(id),ctx=$('scene').getContext('2d');
function sound(type){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type==='damage'?'sawtooth':'triangle';osc.frequency.setValueAtTime(type==='damage'?140:430,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(45,audio.currentTime+.075);gain.gain.setValueAtTime(.09,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.11);}catch{}}
function render(){drawRhythm(ctx,game,{debug:debugBoxes});for(const f of game.fighters){$('hp-'+f.id).textContent=`${f.hp}/${f.maxHp}`;$('bar-'+f.id).style.width=100*f.hp/f.maxHp+'%';}
  const action=game.fighter('A').controller.action;$('phaseLabel').textContent=demo?demo.phase:action?(action.name==='highSlash'?['壹 · 斜斩','贰 · 返斩','叁 · 重斩'][action.cut]:'上挑')+' / '+({startup:'起手',active:'挥击',recovery:'收招'}[action.phase]):'靠近对手 · 按住攻击连续挥剑';
  const b=game.fighter('B');$('combo').textContent=b.body.totalHits>1?`${b.body.totalHits} 连击`:b.body.state==='invulnerable'?'保护起身':'';
  const dead=game.fighters.find(f=>f.dead);$('result').classList.toggle('show',!!dead);$('result').textContent=dead?(dead.id==='B'?'击败赤砂 · 点重来再练':'青石败北 · 点重来再练'):'';
  for(const e of game.events.slice(eventIndex))if(e.type==='damage'||e.type==='guard')sound(e.type);eventIndex=game.events.length;
}
function clear(){game.clearInputs();holdAttack=false;stickPointer=null;$('knob').style.transform='';game.setGuard('A',false);}
function reset(){demo=null;const ai=game.ai,feel={...game.feel},settings={...game.settings};clear();game=new CombatRhythm({ai,feel,settings});eventIndex=0;render();}
$('reset').onclick=reset;$('demo').onclick=()=>{reset();game.ai=false;game.setInput('B',0,0);$('ai').textContent='陪练：关';demo=new RhythmDemo(game);};$('tune').onclick=()=>$('panel').classList.toggle('open');$('boxes').onchange=e=>debugBoxes=e.target.checked;
for(const key of ['attackerStop','victimStop','knockback','gravity','downTime'])$(key).oninput=e=>{const v=Number(e.target.value);if(key==='gravity'||key==='downTime'){const field=key==='gravity'?'gravity':'knockdownSeconds';game.settings[field]=v;for(const f of game.fighters)f.body.cfg[field]=v;}else game.feel[key]=v;$(key+'Value').textContent=v+(key==='downTime'?'s':key==='gravity'?'':'×');};$('ai').onclick=()=>{game.ai=!game.ai;game.setInput('B',0,0);$('ai').textContent='陪练：'+(game.ai?'开':'关');};
$('sound').onclick=()=>{muted=!muted;$('sound').textContent='音效：'+(muted?'关':'开');if(!muted)sound('guard');};
$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch{$('hint').textContent='可手动横屏；当前浏览器未允许全屏或方向锁定';}};
function stick(e){const r=$('stick').getBoundingClientRect(),radius=r.width/2;let x=(e.clientX-r.left-radius)/(radius*.66),z=(e.clientY-r.top-radius)/(radius*.66);const d=Math.max(1,Math.hypot(x,z));x/=d;z/=d;game.setInput('A',x,z);$('knob').style.transform=`translate(${x*radius*.55}px,${z*radius*.55}px)`;}
$('stick').onpointerdown=e=>{e.preventDefault();stickPointer=e.pointerId;$('stick').setPointerCapture(e.pointerId);stick(e);};
$('stick').onpointermove=e=>{if(e.pointerId===stickPointer)stick(e);};
const releaseStick=e=>{if(e.pointerId===stickPointer){stickPointer=null;game.setInput('A',0,0);$('knob').style.transform='';}};
$('stick').onpointerup=releaseStick;$('stick').onpointercancel=releaseStick;$('stick').onlostpointercapture=releaseStick;
document.querySelectorAll('[data-skill]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();game.press('A',b.dataset.skill);render();});
$('basic').onpointerdown=e=>{e.preventDefault();$('basic').setPointerCapture(e.pointerId);holdAttack=true;game.basic();repeatAt=game.time+.15;render();};
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('basic').addEventListener(type,()=>holdAttack=false);
$('guard').onpointerdown=e=>{e.preventDefault();$('guard').setPointerCapture(e.pointerId);game.setGuard('A',true);};
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('guard').addEventListener(type,()=>game.setGuard('A',false));
const keys=new Set();function keyboard(){game.setInput('A',(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0));}
window.addEventListener('keydown',e=>{keys.add(e.key);keyboard();if(e.key==='j')game.basic();if(e.key==='k')game.press('A','launcher');if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();});window.addEventListener('keyup',e=>{keys.delete(e.key);keyboard();});
window.addEventListener('blur',()=>{keys.clear();clear();});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();clear();last=0;}});
function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!paused){if(demo&&!demo.done)demo.update();if(holdAttack&&game.time>=repeatAt){game.basic();repeatAt=game.time+.15;}game.tick(dt);}render();requestAnimationFrame(frame);}render();requestAnimationFrame(frame);
window.rhythmLab={get game(){return game;},get demo(){return demo;},pause(){paused=true;clear();},resume(){paused=false;last=0;},setDebug(on){debugBoxes=on;render();},startDemo(){reset();game.ai=false;demo=new RhythmDemo(game);},step(dt){if(demo&&!demo.done)demo.update();game.tick(dt);render();},reset,advance(t){game.tick(t);render();},render};
</script></html>
