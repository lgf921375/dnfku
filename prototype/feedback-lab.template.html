<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>青石 · 受击动作 V10</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1723;color:#f0eadc;font:14px system-ui;touch-action:none;user-select:none}#game{position:fixed;inset:0}canvas{width:100%;height:100%;object-fit:contain}header{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:24px;justify-content:space-between;pointer-events:none}.fighter{width:35%;max-width:330px;font-size:12px}.fighter b{font-size:16px;letter-spacing:2px}.bar{height:9px;background:#06101a;border:1px solid #a89b7355;margin-top:6px;transform:skewX(-14deg)}.bar span{display:block;height:100%;background:linear-gradient(90deg,#3eaca6,#a0f2d0)}.enemy .bar span{background:linear-gradient(90deg,#bb5549,#eeb883)}#hint{position:absolute;top:65px;left:20px;color:#d6c8ac99;font-size:11px;pointer-events:none}.tools{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:6px}button{color:#ede2ca;border:1px solid #cab38666;background:#172334cc;min-height:38px;border-radius:7px;font-size:12px;padding:6px 10px;touch-action:none}button:active{background:#52667d}#stick{position:absolute;left:30px;bottom:25px;width:126px;height:126px;border-radius:50%;border:1px solid #b8c7d140;background:#172a3c66;box-shadow:inset 0 0 25px #b5d2d10c;touch-action:none}#stick:before{content:'移动';position:absolute;top:7px;width:100%;text-align:center;color:#dae4e466;font-size:10px}#knob{position:absolute;left:40px;top:40px;width:46px;height:46px;border:1px solid #c9d9cf70;border-radius:50%;background:#6f8b9380;pointer-events:none}.skills{position:absolute;right:26px;bottom:20px;display:grid;grid-template-columns:repeat(3,64px);gap:12px;align-items:end}.skills button{border-radius:50%;height:64px;width:64px;border:2px solid #bba575;box-shadow:0 3px 14px #0008;background:radial-gradient(circle at 40% 30%,#4b6272,#142432);font-size:14px}.skills .basic{width:82px;height:82px;grid-row:span 2;align-self:center;border-color:#ddc292;background:radial-gradient(circle at 40% 30%,#836845,#2d2828);font-size:19px}.skills .sub{font-size:11px;height:51px;width:51px}.label{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#9cabba}#combo{position:absolute;right:30px;top:112px;font-size:27px;font-style:italic;color:#efce87;pointer-events:none}#result{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:32px;background:#09111a55;text-shadow:0 4px 14px #000}#result.show{display:flex}#portrait{display:none}@media(orientation:portrait){#portrait{display:block;position:absolute;top:95px;text-align:center;width:100%;color:#ddc293;font-size:12px}.tools{top:140px}.fighter{width:44%}header{gap:15px;top:20px}#hint{top:74px}#stick{left:18px;bottom:45px;width:114px;height:114px}#knob{left:34px;top:34px}.skills{right:16px;bottom:36px;gap:7px;grid-template-columns:repeat(3,53px)}.skills button{width:53px;height:53px;font-size:12px}.skills .basic{width:64px;height:72px;font-size:16px}.skills .sub{width:46px;height:46px}#combo{top:190px;font-size:21px}.label{bottom:12px;width:100%;text-align:center}}
#phaseLabel{position:absolute;left:50%;top:84px;transform:translateX(-50%);color:#f0ce91;font-size:13px;letter-spacing:2px;pointer-events:none}.tools{gap:4px}header{top:18px}.fighter{max-width:240px;width:26%}.bar{height:12px;border-radius:2px}.tools button{min-height:30px;padding:4px 8px;font-size:11px}#hint{top:69px}#panel{position:absolute;top:108px;right:16px;width:246px;padding:14px;background:#121c2eef;border:1px solid #bb9a6755;border-radius:10px;font-size:12px;display:none}#panel.open{display:block}#panel label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}#panel input[type=range]{width:122px;accent-color:#85d7d4}#panel output{color:#f4ce8a;min-width:42px;text-align:right}#panel p{color:#b6bdc9;font-size:10px;line-height:1.6}.skills{grid-template-columns:64px 82px 52px}#combo{top:115px}#stick{background:radial-gradient(circle,#4d6f8055,#0b142466)}.skills button{background:radial-gradient(circle at 35% 25%,#466d80,#17202c)}@media(max-height:440px){header{top:8px}.tools{top:7px}#hint{top:52px;font-size:10px}#phaseLabel{top:70px}#stick{width:100px;height:100px;left:20px;bottom:16px}#knob{left:28px;top:28px}.skills{bottom:14px}#panel{top:76px;padding:10px}#panel label{margin:6px 0}#combo{top:98px}}@media(orientation:portrait){.fighter{width:43%}.tools{top:120px}#phaseLabel{top:180px}#panel{top:216px}.skills{grid-template-columns:53px 64px 46px}#hint{max-width:90%;font-size:10px}}
</style><div id="game"><canvas id="scene" width="960" height="540"></canvas><header><div class="fighter"><b>青石</b> <span id="hp-A"></span><div class="bar"><span id="bar-A"></span></div></div><div class="fighter enemy"><b>赤砂</b> <span id="hp-B"></span><div class="bar"><span id="bar-B"></span></div></div></header>
<div id="hint">同一个攻击键：三段普攻 / 低空追击 / 落地追击</div><div id="portrait">横屏操作更方便 · 支持摇杆与技能同时触摸</div><div class="tools"><button id="reset">重来</button><button id="demo">连招演示</button><button id="record">录制战斗</button><button id="tune">调节</button><button id="ai">陪练：关</button><button id="sound">音效：关</button><button id="fullscreen">全屏</button></div><div id="combo"></div><div id="phaseLabel"></div><div id="result"></div>
<div id="stick" role="button" aria-label="连续移动摇杆"><div id="knob"></div></div><div class="skills"><button data-skill="launcher">上挑</button><button class="basic" id="basic">攻击</button><button class="sub" id="guard">格挡</button></div><div class="label">V10 受击动作与刀刃接触 · J 普攻 / K 上挑 / WASD 移动</div></div>
<aside id="panel"><b>手感实验参数</b><label>攻击者顿帧 <input id="attackerStop" type="range" min="0" max="2" step=".1" value="1"><output id="attackerStopValue">1×</output></label><label>受击者顿帧 <input id="victimStop" type="range" min="0" max="2" step=".1" value="1"><output id="victimStopValue">1×</output></label><label>浮空重力 <input id="gravity" type="range" min="12" max="36" step="1" value="22"><output id="gravityValue">22</output></label><label>击退强度 <input id="knockback" type="range" min="0" max="2" step=".1" value="1"><output id="knockbackValue">1×</output></label><label>倒地时间 <input id="downTime" type="range" min=".4" max="1.6" step=".1" value=".9"><output id="downTimeValue">0.9s</output></label><label>显示碰撞盒 <input id="boxes" type="checkbox"></label><p>均为原创实验值。普攻三段基础顿帧45 / 55 / 85ms；上挑70ms。绿色为攻击范围，金色为受击范围。</p></aside><script>
/* COMBAT_MODULES */
let demo=null,debugBoxes=false;
let game=new CombatFeedback(),last=0,holdAttack=false,repeatAt=0,stickPointer=null,muted=true,audio=null,eventIndex=0,paused=false;
const $=id=>document.getElementById(id),ctx=$('scene').getContext('2d');
function sound(type,weight=1){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type==='damage'?'sawtooth':'triangle';osc.frequency.setValueAtTime(type==='damage'?(190-weight*25):430,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(45,audio.currentTime+.075);gain.gain.setValueAtTime(.09,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.1);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.11);}catch{}}
function render(){drawFeedback(ctx,game,{debug:debugBoxes});for(const f of game.fighters){$('hp-'+f.id).textContent=`${f.hp}/${f.maxHp}`;$('bar-'+f.id).style.width=100*f.hp/f.maxHp+'%';}
  const action=game.fighter('A').controller.action;$('phaseLabel').textContent=demo?demo.phase:action?(action.name==='highSlash'?['壹 · 斜斩','贰 · 返斩','叁 · 重斩'][action.cut]:'上挑')+' / '+({startup:'起手',active:'挥击',recovery:'收招'}[action.phase]):'靠近对手 · 按住攻击连续挥剑';
  const b=game.fighter('B');$('combo').textContent=b.body.totalHits>1?`${b.body.totalHits} 连击`:b.body.state==='invulnerable'?'保护起身':'';
  const dead=game.fighters.find(f=>f.dead);$('result').classList.toggle('show',!!dead);$('result').textContent=dead?(dead.id==='B'?'击败赤砂 · 点重来再练':'青石败北 · 点重来再练'):'';
  for(const e of game.events.slice(eventIndex))if(e.type==='damage'||e.type==='guard')sound(e.type,e.cut===null?3:(e.cut??0)+1);eventIndex=game.events.length;
}
function clear(){game.clearInputs();holdAttack=false;stickPointer=null;$('knob').style.transform='';game.setGuard('A',false);}
function reset(){demo=null;const ai=game.ai,feel={...game.feel},settings={...game.settings};clear();game=new CombatFeedback({ai,feel,settings});eventIndex=0;render();}
let recorder=null,recordChunks=[];
$('record').onclick=()=>{
  if(recorder?.state==='recording'){recorder.stop();return;}
  try{recordChunks=[];const stream=$('scene').captureStream(30);recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
    recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data);};
    recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(recordChunks,{type:'video/webm'}));a.download='dnfku-v10-browser.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);stream.getTracks().forEach(t=>t.stop());$('record').textContent='录制战斗';};
    recorder.start();$('record').textContent='停止并下载';
  }catch(error){$('hint').textContent='当前浏览器不支持画布录制：'+error.message;}
};
$('reset').onclick=reset;$('demo').onclick=()=>{reset();game.ai=false;game.setInput('B',0,0);$('ai').textContent='陪练：关';demo=new RhythmDemo(game);};$('tune').onclick=()=>$('panel').classList.toggle('open');$('boxes').onchange=e=>debugBoxes=e.target.checked;
for(const key of ['attackerStop','victimStop','knockback','gravity','downTime'])$(key).oninput=e=>{const v=Number(e.target.value);if(key==='gravity'||key==='downTime'){const field=key==='gravity'?'gravity':'knockdownSeconds';game.settings[field]=v;for(const f of game.fighters)f.body.cfg[field]=v;}else game.feel[key]=v;$(key+'Value').textContent=v+(key==='downTime'?'s':key==='gravity'?'':'×');};$('ai').onclick=()=>{game.ai=!game.ai;game.setInput('B',0,0);$('ai').textContent='陪练：'+(game.ai?'开':'关');};
$('sound').onclick=()=>{muted=!muted;$('sound').textContent='音效：'+(muted?'关':'开');if(!muted)sound('guard');};
$('fullscreen').onclick=async()=>{try{await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape');}catch{$('hint').textContent='可手动横屏；当前浏览器未允许全屏或方向锁定';}};
function stick(e){const r=$('stick').getBoundingClientRect(),radius=r.width/2;let x=(e.clientX-r.left-radius)/(radius*.66),z=(e.clientY-r.top-radius)/(radius*.66);const d=Math.max(1,Math.hypot(x,z));x/=d;z/=d;game.setInput('A',x,z);$('knob').style.transform=`translate(${x*radius*.55}px,${z*radius*.55}px)`;}
$('stick').onpointerdown=e=>{e.preventDefault();stickPointer=e.pointerId;$('stick').setPointerCapture(e.pointerId);stick(e);};
$('stick').onpointermove=e=>{if(e.pointerId===stickPointer)stick(e);};
const releaseStick=e=>{if(e.pointerId===stickPointer){stickPointer=null;game.setInput('A',0,0);$('knob').style.transform='';}};
$('stick').onpointerup=releaseStick;$('stick').onpointercancel=releaseStick;$('stick').onlostpointercapture=releaseStick;
document.querySelectorAll('[data-skill]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();game.press('A',b.dataset.skill);render();});
$('basic').onpointerdown=e=>{e.preventDefault();$('basic').setPointerCapture(e.pointerId);holdAttack=true;game.basic();repeatAt=game.time+.15;render();};
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('basic').addEventListener(type,()=>holdAttack=false);
$('guard').onpointerdown=e=>{e.preventDefault();$('guard').setPointerCapture(e.pointerId);game.setGuard('A',true);};
for(const type of ['pointerup','pointercancel','lostpointercapture'])$('guard').addEventListener(type,()=>game.setGuard('A',false));
const keys=new Set();function keyboard(){game.setInput('A',(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0),(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0));}
window.addEventListener('keydown',e=>{keys.add(e.key);keyboard();if(e.key==='j')game.basic();if(e.key==='k')game.press('A','launcher');if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();});window.addEventListener('keyup',e=>{keys.delete(e.key);keyboard();});
window.addEventListener('blur',()=>{keys.clear();clear();});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();clear();last=0;}});
function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;if(!paused){if(demo&&!demo.done)demo.update();if(holdAttack&&game.time>=repeatAt){game.basic();repeatAt=game.time+.15;}game.tick(dt);}render();requestAnimationFrame(frame);}render();requestAnimationFrame(frame);
window.rhythmLab={get game(){return game;},get demo(){return demo;},pause(){paused=true;clear();},resume(){paused=false;last=0;},setDebug(on){debugBoxes=on;render();},startDemo(){reset();game.ai=false;demo=new RhythmDemo(game);},step(dt){if(demo&&!demo.done)demo.update();game.tick(dt);render();},reset,advance(t){game.tick(t);render();},render};
</script></html>
