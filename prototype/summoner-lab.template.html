<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>召唤师普攻 · S1 动作候选</title><style>
/* OFFLINE_FONT */
*{box-sizing:border-box}body{margin:0;background:#151625;color:#eee5f4;font-family:MotionFont,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0 0 5px}p{font-size:13px;line-height:1.7;color:#b9abc8;margin:4px 0 12px}.badge{font-size:12px;background:#3b3051;padding:7px 11px;border-radius:20px;white-space:nowrap}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #4b3d62;border-radius:14px;background:#24203b}nav,.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button{font:inherit;font-size:14px;min-height:44px;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:10px;padding:9px 16px;cursor:pointer;touch-action:none}button.primary{background:#ab88d7;color:#1c142a;font-weight:700}button:focus-visible{outline:2px solid #ebd7ff}label{font-size:13px;display:flex;align-items:center;gap:8px}input[type=range]{width:180px;accent-color:#bc9ce9}#status{font-size:13px;color:#d6c1ed;min-height:23px;margin:12px 0 5px}.foot{margin-top:16px;border-top:1px solid #443653;padding-top:12px}a{color:#ccb0ef}details{margin-top:12px}summary{cursor:pointer;font-size:13px;color:#beaecb}@media(max-width:600px){main{padding:12px}h1{font-size:18px}header{align-items:flex-start}.badge{font-size:10px}button{padding:8px 12px}nav{gap:6px}}
</style></head><body><main><header><div><h1>召唤师本人 · 普通攻击</h1><p>首段前伸 → 斜向上挥 → 压低身体收杖</p></div><span class="badge">S1 · 动作候选</span></header><canvas id="stage" width="960" height="540"></canvas>
<div id="status" aria-live="polite">等待输入</div><nav><button id="attack" class="primary">普通攻击 · X</button><button id="replay">整套参考演示</button><button id="reset">重来</button><button id="face">转身</button><button id="record">录制动作</button></nav>
<div class="tools"><label><input type="checkbox" id="rig">查看骨架</label><label><input type="checkbox" id="slow">慢放 0.25×</label></div>
<details><summary>逐帧查看</summary><div class="tools"><label>参考帧 <input id="frame" type="range" min="0" max="30" step="1" value="0"><output id="frameLabel">0</output></label><button id="resume">恢复操作</button></div></details>
<p class="foot">按 X 或长按攻击键连贯出招，A / D 移动。<a href="https://www.bilibili.com/video/BV1vDx1zKEKg/" target="_blank" rel="noopener">空挥参考：19.167–20.167 秒</a>。当前按该片段估计动作节奏，命中、浮空与受击效果待对齐。</p></main><script>
/* SUMMONER_MODULES */
const motion=new SummonerMotion(),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const lab={motion,draw(){drawSummoner(ctx,motion,{rig:document.querySelector('#rig').checked});},samples:[]};window.summonerLab=lab;
const button=id=>document.getElementById(id),keys=new Set();
button('attack').addEventListener('pointerdown',e=>{e.preventDefault();button('attack').setPointerCapture(e.pointerId);motion.setHeld(true);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])button('attack').addEventListener(event,()=>motion.setHeld(false));
button('replay').onclick=()=>motion.playReference();button('reset').onclick=()=>{keys.clear();motion.reset();};button('face').onclick=()=>motion.face(-motion.facing);
button('frame').oninput=e=>{motion.seekFrame(+e.target.value);button('frameLabel').value=e.target.value;lab.draw();};
button('resume').onclick=()=>motion.reset();
addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;if(['x','a','d','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!keys.has(e.key)&&e.key==='x')motion.setHeld(true);keys.add(e.key);}});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='x')motion.setHeld(false);});
const release=()=>{keys.clear();motion.setHeld(false);};addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
let last=null,recorder=null,chunks=[],stream=null;
button('record').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();return;}
 try{stream=canvas.captureStream(30);const mime=['video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType})),a=document.createElement('a');a.href=url;a.download='summoner-s1-canvas.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);stream.getTracks().forEach(t=>t.stop());button('record').textContent='录制动作';};recorder.start(250);button('record').textContent='停止并下载';}catch(e){button('status').textContent='录制不可用：'+e.message;}};
function raf(now){const dt=summonerFrameDelta(now,last);last=now;const slow=button('slow').checked?.25:1;
 const dir=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);if(dir)motion.move(dir*95*dt*slow);
 motion.tick(dt*slow);lab.draw();const a=motion.action;button('status').textContent=motion.paused?'逐帧预览 · 按“恢复操作”继续':a?['首段 · 前伸','第二段 · 斜向上挥','末段 · 压低收杖'][a.stage]:'等待输入 · X / 长按攻击';
 if(lab.samples.length<5000)lab.samples.push({wall:now,time:motion.time,stage:a?.stage??null,frame:a?.frame??null,held:motion.held});requestAnimationFrame(raf);}
lab.draw();requestAnimationFrame(raf);
</script></body></html>
