function summonerStaffContact(a,b,box,radius=2.1){

function drawSummonerTargetS3(ctx,motion,rig){
 const t=motion.target;if(!t.present)return;const p=motion.targetPose(),scale=2.45,floor=402+t.lane*scale;
 const pt=(x,y)=>[470+x*scale,floor-y*scale];
 const line=(a,b,width,color)=>{ctx.lineWidth=width*scale;ctx.strokeStyle=color;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...pt(...a));ctx.lineTo(...pt(...b));ctx.stroke();};
 const wood=t.stop>0?'#f7e4b7':t.hp<=0?'#645750':'#a87d52';
 ctx.fillStyle='#0f132188';ctx.beginPath();ctx.ellipse(...pt(t.x,-2),32,9,0,0,Math.PI*2);ctx.fill();
 line([p.hip.x,p.hip.y],[t.x-8,9],8,'#5b493b');line([p.hip.x,p.hip.y],[t.x+8,9],8,'#70533e');
 line([t.x-8,9],[t.x-11,2],6,'#41352f');line([t.x+8,9],[t.x+12,2],6,'#41352f');
 ctx.fillStyle=wood;ctx.strokeStyle='#382e2c';ctx.lineWidth=2;ctx.beginPath();
 for(const [i,a] of [[p.hip.x-9,p.hip.y],[p.shoulder.x-10,p.shoulder.y],[p.shoulder.x+10,p.shoulder.y],[p.hip.x+9,p.hip.y]].entries())i?ctx.lineTo(...pt(...a)):ctx.moveTo(...pt(...a));

 ctx.fillStyle=wood;ctx.beginPath();ctx.ellipse(...pt(p.head.x,p.head.y),8*scale,9*scale,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 line([p.head.x-3,p.head.y+1],[p.head.x+3,p.head.y+1],.8,'#5b4534');
 line([p.shoulder.x-6,p.shoulder.y-8],[p.hip.x+5,p.hip.y+6],.8,'#73573e');

}
function drawSummonerImpactS3(ctx,motion){

  ctx.fillStyle='#fff7df';ctx.beginPath();ctx.arc(0,0,Math.max(.6,4*(1-u)),0,Math.PI*2);ctx.fill();ctx.restore();
 }
}

const motion=new SummonerFeedbackS3(),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const lab={motion,draw(){drawSummonerFeedbackS3(ctx,motion,{rig:document.querySelector('#rig').checked});},samples:[]};window.summonerLab=lab;
const button=id=>document.getElementById(id),keys=new Set();
let audioContext=null,audioCursor=0;
lab.audio={played:0,scheduled:[],error:null};
function audioReady(){if(!button('sound').checked)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(e=>{lab.audio.error=e.message;});}catch(e){lab.audio.error=e.message;}}
function pumpAudio(){while(audioCursor<motion.events.length){const e=motion.events[audioCursor++];if(e.type!=='impact'||!e.feedbackEnabled||!button('sound').checked||audioContext?.state!=='running')continue;
 const samples=summonerImpactSamples(e.stage,audioContext.sampleRate),buffer=audioContext.createBuffer(1,samples.length,audioContext.sampleRate);buffer.copyToChannel(samples,0);const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);source.onended=()=>source.disconnect();source.start();lab.audio.played++;lab.audio.scheduled.push({attackId:e.attackId,stage:e.stage,samples:samples.length});}
 lab.audio.contextState=audioContext?.state??'not-created';}
function applyTarget(){motion.target.present=!button('empty').checked;motion.target.lane=button('lane').checked?24:0;motion.setFeedbackEnabled(button('feedback').checked);}
function resetS3(){motion.reset();applyTarget();audioCursor=0;}
for(const id of ['empty','lane','feedback'])button(id).onchange=applyTarget;button('sound').onchange=audioReady;

button('attack').addEventListener('pointerdown',e=>{e.preventDefault();audioReady();button('attack').setPointerCapture(e.pointerId);motion.setHeld(true);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])button('attack').addEventListener(event,()=>motion.setHeld(false));
button('replay').onclick=()=>{audioReady();motion.playReference();applyTarget();audioCursor=0;};button('reset').onclick=()=>{keys.clear();resetS3();};button('face').onclick=()=>{motion.face(-motion.facing);motion.placeTargetInFront();};
button('frame').oninput=e=>{motion.seekFrame(+e.target.value);button('frameLabel').value=e.target.value;lab.draw();};
button('resume').onclick=resetS3;
addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;if(['x','a','d','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!keys.has(e.key)&&e.key==='x'){audioReady();motion.setHeld(true);}keys.add(e.key);}});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='x')motion.setHeld(false);});
const release=()=>{keys.clear();motion.setHeld(false);};addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
let last=null,recorder=null,chunks=[],stream=null;
button('record').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();return;}
 try{stream=canvas.captureStream(30);const mime=['video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType})),a=document.createElement('a');a.href=url;a.download='summoner-s3-canvas.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);stream.getTracks().forEach(t=>t.stop());button('record').textContent='录制动作';};recorder.start(250);button('record').textContent='停止并下载';}catch(e){button('status').textContent='录制不可用：'+e.message;}};
function raf(now){const dt=summonerFrameDelta(now,last);last=now;const slow=button('slow').checked?.25:1;
 const dir=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);if(dir)motion.move(dir*95*dt*slow);
 motion.tick(dt*slow);pumpAudio();lab.draw();const a=motion.action;button('status').textContent=motion.paused?'逐帧预览 · 按“恢复操作”继续':a?['首段 · 前伸','第二段 · 斜向上挥','末段 · 空中收杖'][a.stage]:'等待输入 · X / 长按攻击';button('status').textContent+=` · 命中 ${motion.hitCount}`;
 if(lab.samples.length<5000)lab.samples.push({wall:now,time:motion.time,feedbackTime:motion.feedbackTime,stop:motion.attackerStop,targetX:motion.target.x,targetAge:motion.target.reaction?.age??null,stage:a?.stage??null,frame:a?.frame??null,held:motion.held});requestAnimationFrame(raf);}
lab.draw();requestAnimationFrame(raf);
