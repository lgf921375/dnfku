<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>召唤师普攻 · S7 反馈试验</title><style>
/* OFFLINE_FONT */
*{box-sizing:border-box}body{margin:0;background:#151625;color:#eee5f4;font-family:MotionFont,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0 0 5px}p{font-size:13px;line-height:1.7;color:#b9abc8;margin:4px 0 12px}.badge{font-size:12px;background:#3b3051;padding:7px 11px;border-radius:20px;white-space:nowrap}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #4b3d62;border-radius:14px;background:#24203b}nav,.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button{font:inherit;font-size:14px;min-height:44px;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:10px;padding:9px 16px;cursor:pointer;touch-action:none}button.primary{background:#ab88d7;color:#1c142a;font-weight:700}select{font:inherit;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:8px;min-height:36px}button:focus-visible{outline:2px solid #ebd7ff}label{font-size:13px;display:flex;align-items:center;gap:8px}input[type=range]{width:180px;accent-color:#bc9ce9}#status{font-size:13px;color:#d6c1ed;min-height:23px;margin:12px 0 5px}.foot{margin-top:16px;border-top:1px solid #443653;padding-top:12px}a{color:#ccb0ef}details{margin-top:12px}summary{cursor:pointer;font-size:13px;color:#beaecb}@media(max-width:600px){main{padding:12px}h1{font-size:18px}header{align-items:flex-start}.badge{font-size:10px}button{padding:8px 12px}nav{gap:6px}}
@media(orientation:landscape) and (max-height:500px){main{padding:8px}header{margin-bottom:6px}header h1{font-size:18px}header p{display:none}.badge{font-size:11px;padding:5px 10px}canvas{width:min(100%,calc((100svh - 130px)*16/9));margin-inline:auto;border-radius:10px}#status{margin:6px 0 4px}nav{margin-top:6px}}
</style></head><body><main><header><div><h1>召唤师本人 · 普通攻击</h1><p>接触位置 / 景深 / 连续受击对照</p></div><span class="badge">S7 · 反馈试验</span></header><canvas id="stage" width="960" height="540"></canvas>
<div id="status" aria-live="polite">等待输入</div><nav><button id="attack" class="primary">普通攻击 · X</button><button id="replay">整套参考演示</button><button id="reset">重来</button><button id="face">转身</button><button id="record">录制动作</button></nav>
<div class="tools"><label>对照状态 <select id="scene"><option value="standing">站立</option><option value="air">预置浮空</option><option value="down">预置倒地</option><option value="rise">预置起身</option></select></label><label><input type="checkbox" id="pk">PK角色对照</label><label><input type="checkbox" id="empty">空挥</label><label><input type="checkbox" id="feedback" checked>命中反馈</label><label><input type="checkbox" id="sound">声音</label><label><input type="checkbox" id="lane">错位目标</label><label><input type="checkbox" id="rig">查看骨架</label><label><input type="checkbox" id="slow">慢放 0.25×</label></div>
<details><summary>逐帧查看</summary><div class="tools"><label>参考帧 <input id="frame" type="range" min="0" max="30" step="1" value="0"><output id="frameLabel">0</output></label><button id="resume">恢复操作</button></div><div class="tools"><label><input type="checkbox" id="outline">轮廓接触试验</label><label>景深微调 <input id="depth" type="range" min="-9" max="9" step="1" value="0"></label><button id="edge">接触边缘对照</button><label><input type="checkbox" id="fragile">低血量对照</label><label><input type="checkbox" id="armor">霸体对照</label><label><input type="checkbox" id="protect">PK保护试验（候选参数）</label></div></details>
<p class="foot">按 X 或长按攻击键连贯出招，A / D 移动。<a href="https://www.bilibili.com/video/BV1vDx1zKEKg/" target="_blank" rel="noopener">空挥参考：19.167–20.167 秒</a>。动作按空挥片段估计；命中反馈参数为试验候选，可预置目标浮空、倒地状态对照；普攻需实际接触才命中。默认矩形接触；可开启轮廓试验，对照边缘接触；受击姿态与PK保护参数尚未对齐原版。</p></main><script>
/* SUMMONER_MODULES */
const motion=new SummonerVictimS7(),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const lab={motion,draw(){drawSummonerVictimS7(ctx,motion,{rig:document.querySelector('#rig').checked});},samples:[]};window.summonerLab=lab;
const button=id=>document.getElementById(id),keys=new Set();
let audioContext=null,audioCursor=0;
lab.audio={played:0,scheduled:[],error:null};
function audioReady(){if(!button('sound').checked)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(e=>{lab.audio.error=e.message;});}catch(e){lab.audio.error=e.message;}}
function pumpAudio(){while(audioCursor<motion.events.length){const e=motion.events[audioCursor++];if(e.type!=='impact'||!e.feedbackEnabled||!button('sound').checked||audioContext?.state!=='running')continue;
 const samples=summonerImpactSamples(e.stage,audioContext.sampleRate),buffer=audioContext.createBuffer(1,samples.length,audioContext.sampleRate);buffer.copyToChannel(samples,0);const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);source.onended=()=>source.disconnect();source.start();lab.audio.played++;lab.audio.scheduled.push({attackId:e.attackId,stage:e.stage,samples:samples.length});}
 lab.audio.contextState=audioContext?.state??'not-created';}
function applyTarget(){motion.target.present=!button('empty').checked;motion.target.lane=button('lane').checked?24:+button('depth').value;motion.setFeedbackEnabled(button('feedback').checked);motion.setTargetKind(button('pk').checked?'player':'monster');motion.setArmored(button('armor').checked);motion.setPKProtection(button('protect').checked);motion.setLegacyContact(!button('outline').checked);}
function resetS7(){motion.reset();applyTarget();audioCursor=0;}
button('fragile').onchange=()=>{keys.clear();motion.setFragile(button('fragile').checked);applyTarget();audioCursor=0;};
button('scene').onchange=()=>{keys.clear();motion.setScenario(button('scene').value);applyTarget();audioCursor=0;};
button('depth').oninput=applyTarget;button('edge').onclick=()=>{keys.clear();button('scene').value='standing';button('depth').value='0';for(const id of ['fragile','empty','lane','armor','protect'])button(id).checked=false;button('feedback').checked=true;applyTarget();motion.playContactEdge();audioCursor=0;lab.draw();};
for(const id of ['pk','empty','lane','feedback','armor','protect','outline'])button(id).onchange=applyTarget;button('sound').onchange=audioReady;

button('attack').addEventListener('pointerdown',e=>{e.preventDefault();audioReady();button('attack').setPointerCapture(e.pointerId);motion.setHeld(true);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])button('attack').addEventListener(event,()=>motion.setHeld(false));
button('replay').onclick=()=>{audioReady();motion.playReference();applyTarget();audioCursor=0;};button('reset').onclick=()=>{keys.clear();resetS7();};button('face').onclick=()=>{motion.face(-motion.facing);motion.placeTargetInFront();};
button('frame').oninput=e=>{motion.seekFrame(+e.target.value);button('frameLabel').value=e.target.value;lab.draw();};
button('resume').onclick=resetS7;
addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;if(['x','a','d','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!keys.has(e.key)&&e.key==='x'){audioReady();motion.setHeld(true);}keys.add(e.key);}});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='x')motion.setHeld(false);});
const release=()=>{keys.clear();motion.setHeld(false);};addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
let last=null,recorder=null,chunks=[],stream=null;
button('record').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();return;}
 try{stream=canvas.captureStream(30);const mime=['video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType})),a=document.createElement('a');a.href=url;a.download='summoner-s7-canvas.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);stream.getTracks().forEach(t=>t.stop());button('record').textContent='录制动作';};recorder.start(250);button('record').textContent='停止并下载';}catch(e){button('status').textContent='录制不可用：'+e.message;}};
function raf(now){const dt=summonerFrameDelta(now,last);last=now;const slow=button('slow').checked?.25:1;
 const dir=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);if(dir)motion.move(dir*95*dt*slow);
 motion.tick(dt*slow);pumpAudio();lab.draw();if(lab.victimFrames&&lab.victimFrames.length<1000)lab.victimFrames.push({phase:motion.targetPose().phase,pose:motion.targetPose(),stop:motion.target.stop,time:motion.feedbackTime});const a=motion.action;button('status').textContent=motion.paused?'逐帧预览 · 按“恢复操作”继续':a?['首段 · 前伸','第二段 · 斜向上挥','末段 · 空中收杖'][a.stage]:'等待输入 · X / 长按攻击';button('status').textContent+=` · 命中 ${motion.hitCount} · ${{idle:'站立',impact:'冲击',hold:'硬直',recover:'恢复','air-rise':'上升','air-fall':'下落','air-hit':'空中受击',down:'倒地','down-hit':'倒地受击',landing:'落地',rise:'起身','defeat-hit':'致死受击','defeat-fall':'死亡下落','defeat-down':'死亡倒地'}[motion.targetPose().phase]}`;
 if(lab.samples.length<5000)lab.samples.push({wall:now,time:motion.time,feedbackTime:motion.feedbackTime,stop:motion.attackerStop,targetX:motion.target.x,targetAge:motion.target.reaction?.age??null,stage:a?.stage??null,frame:a?.frame??null,held:motion.held});requestAnimationFrame(raf);}
lab.draw();requestAnimationFrame(raf);
</script></body></html>
