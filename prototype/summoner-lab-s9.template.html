<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>召唤师普攻 · S9 连招组合</title><style>
/* OFFLINE_FONT */
*{box-sizing:border-box}body{margin:0;background:#151625;color:#eee5f4;font-family:MotionFont,system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0 0 5px}p{font-size:13px;line-height:1.7;color:#b9abc8;margin:4px 0 12px}.badge{font-size:12px;background:#3b3051;padding:7px 11px;border-radius:20px;white-space:nowrap}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #4b3d62;border-radius:14px;background:#24203b}nav,.tools{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button{font:inherit;font-size:14px;min-height:44px;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:10px;padding:9px 16px;cursor:pointer;touch-action:none}button.primary{background:#ab88d7;color:#1c142a;font-weight:700}select{font:inherit;background:#382e4b;color:#eee5f4;border:1px solid #645176;border-radius:8px;min-height:36px}button:focus-visible,select:focus-visible{outline:2px solid #ebd7ff}label{font-size:13px;display:flex;align-items:center;gap:8px}input[type=range]{width:180px;accent-color:#bc9ce9}#status{font-size:13px;color:#d6c1ed;min-height:23px;margin:12px 0 5px}.foot{margin-top:16px;border-top:1px solid #443653;padding-top:12px}a{color:#ccb0ef}details{margin-top:12px}summary{cursor:pointer;font-size:13px;color:#beaecb} .comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0;padding:10px;border:1px solid #4b3d62;border-radius:12px}.comparison label{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:5px}.comparison select{width:100%;min-height:44px;padding:6px;min-width:0}#comparisonHint{grid-column:1/-1;margin:0;font-size:12px;line-height:1.5}#comboTimeline{font-size:12px;line-height:1.5;min-height:23px;color:#c7b3dd;margin:5px 0}#comboTimeline span{display:inline-block;margin:2px 5px 2px 0;padding:3px 7px;border:1px solid #645176;border-radius:12px}#comboTimeline span:last-child{background:#5c4378;color:#fff}.tools select{min-height:44px}@media(max-width:600px){main{padding:12px}h1{font-size:18px}header{align-items:flex-start}.badge{font-size:10px}button{padding:8px 12px}nav{gap:6px}.comparison{padding:8px;gap:7px}.comparison select{font-size:12px}header p{font-size:12px}}
@media(orientation:landscape) and (max-height:500px){main{padding:8px}header{margin-bottom:4px}header h1{font-size:18px}header p{display:none}.badge{font-size:11px;padding:5px 10px}.comparison{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);margin:4px 0;padding:5px;align-items:center}.comparison label{flex-direction:row;align-items:center;white-space:nowrap}.comparison select{font-size:12px}#comparisonHint{grid-column:auto;font-size:11px;line-height:1.3}canvas{width:min(100%,calc((100svh - 215px)*16/9));margin-inline:auto;border-radius:10px}#status{margin:4px 0;min-height:20px}#comboTimeline{min-height:18px;margin:3px 0}#comboTimeline span{padding:1px 5px}nav{margin-top:4px}}
</style></head><body><main><header><div><h1>召唤师 · 普攻连招</h1><p>对照与起始状态一起生效，连续看完整过程</p></div><span class="badge">S9 · 连招组合</span></header><div class="comparison" role="group" aria-label="连招组合"><label for="comparison">对照组合 <select id="comparison" aria-describedby="comparisonHint"></select></label><label for="scene">状态组合 <select id="scene"><option value="air-flow">连贯 · 浮空到起身</option><option value="standing">从站立开始</option><option value="air">从浮空开始</option><option value="down">从倒地开始</option><option value="rise">从起身开始</option></select></label><p id="comparisonHint" aria-live="polite"></p></div><canvas id="stage" width="960" height="540"></canvas>
<div id="status" aria-live="polite">等待输入</div><div id="comboTimeline" aria-label="实际连招过程">等待完整连招</div><nav><button id="combo" class="primary">完整连招</button><button id="attack">普通攻击 · X</button><button id="replay">播放一套</button><button id="reset">重来</button><button id="face">转身</button><button id="record">录制动作</button></nav>
<div class="tools"><label><input type="checkbox" id="sound">声音</label><label><input type="checkbox" id="rig">查看骨架</label><label><input type="checkbox" id="slow">慢放 0.25×</label></div><details><summary>逐帧查看</summary><div class="tools"><label><input type="checkbox" id="pk">PK角色</label><label><input type="checkbox" id="empty">空挥</label><label><input type="checkbox" id="feedback" checked>命中反馈</label><label><input type="checkbox" id="lane">错位目标</label></div><div class="tools"><label>参考帧 <input id="frame" type="range" min="0" max="30" step="1" value="0"><output id="frameLabel">0</output></label><button id="resume">恢复操作</button></div><div class="tools"><label><input type="checkbox" id="outline">轮廓接触试验</label><label>景深微调 <input id="depth" type="range" min="-9" max="9" step="1" value="0"></label><button id="edge">接触边缘对照</button><label><input type="checkbox" id="fragile">低血量对照</label><label><input type="checkbox" id="armor">霸体对照</label><label><input type="checkbox" id="protect">PK保护试验（候选参数）</label></div></details>
<p class="foot">两项选择共同生效。点“完整连招”自动近身接续，最多四套；保护起身或死亡后停下。状态条只记录本次真实过程。连贯状态从预置浮空开始，普攻不自动挑飞。按 X 或长按攻击键连贯出招，A / D 移动。<a href="https://www.bilibili.com/video/BV1vDx1zKEKg/" target="_blank" rel="noopener">空挥参考：19.167–20.167 秒</a>。动作按空挥片段估计；命中反馈参数为试验候选，可预置目标浮空、倒地状态对照；普攻需实际接触才命中。默认矩形接触；可开启轮廓试验，对照边缘接触；受击姿态与PK保护参数尚未对齐原版。</p></main><script>
/* SUMMONER_MODULES */
const motion=new SummonerVictimS7(),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
const lab={motion,draw(){drawSummonerVictimS7(ctx,motion,{rig:document.querySelector('#rig').checked});},samples:[]};window.summonerLab=lab;
const button=id=>document.getElementById(id),keys=new Set();
// Comparison type and starting state are independent axes of one fixture.
const combo=new SummonerComboS9(motion);lab.combo=combo;lab.timeline=[];let timelineCursor=0;
const comparisonDefaults={pk:false,empty:false,feedback:true,lane:false,outline:false,depth:0,fragile:false,armor:false,protect:false};
const comparisonPresets=[
 {id:'combined',label:'综合连招 · PK保护',hint:'命中、落地、追击与候选保护一起观察',settings:{pk:true,protect:true}},
 {id:'standing',label:'普通怪物 · 完整反馈',hint:'普通怪物，不启用PK保护',settings:{}},
 {id:'player',label:'PK角色 · 关闭保护',hint:'角色反馈，保护开关关闭',settings:{pk:true}},
 {id:'armor',label:'霸体 · 仍然扣血',hint:'观察扣血、短停与霸体不中断',settings:{armor:true}},
 {id:'no-feedback',label:'关闭命中反馈',hint:'接触仍扣血，不显示短停、硬直与火花',settings:{feedback:false}},
 {id:'empty',label:'空挥 · 本人动作',hint:'目标隐藏，只看本人连续动作',settings:{empty:true}},
 {id:'fragile',label:'低血量 · 致死接续',hint:'起始血量5，观察死亡后自然下落',settings:{fragile:true}},
 {id:'outline',label:'轮廓接触试验',hint:'原创轮廓候选，可能漏接扫地',settings:{outline:true}},
 {id:'depth-front',label:'景深 +9 · 连招',hint:'正向偏移下观察连续接触',settings:{depth:9}},
 {id:'depth-back',label:'景深 −9 · 连招',hint:'反向偏移下观察连续接触',settings:{depth:-9}},
 {id:'depth-miss',label:'景深错位 · 无接触',hint:'错位24，应连续打空',settings:{lane:true}}
];
for(const p of comparisonPresets)button('comparison').append(new Option(p.label,p.id));
button('comparison').append(new Option('自定义 · 手动调节','custom'));
const selectedComparison=()=>comparisonPresets.find(p=>p.id===button('comparison').value);
const startScene=()=>button('scene').value==='air-flow'?'air':button('scene').value;
function comparisonHint(){const p=selectedComparison();button('comparisonHint').textContent=(p?p.hint:'高级控件自定义')+'；'+button('scene').selectedOptions[0].textContent+'。点完整连招。';}
function cancelComparison(reason='input'){combo.cancel(reason);lab.comparisonRun=null;motion.replay=false;keys.clear();motion.setHeld(false);motion.queue=false;}
function resetComparison(){cancelComparison('reset');combo.run=null;motion.scenario=startScene();motion.fragile=button('fragile').checked;motion.reset();applyTarget();audioCursor=0;button('frame').value='0';button('frameLabel').value='0';lab.timeline=[];timelineCursor=0;button('comboTimeline').textContent='等待完整连招';button('combo').textContent='完整连招';lab.draw();}
function selectComparison(){const p=selectedComparison();if(p){const settings={...comparisonDefaults,...p.settings};for(const [id,value] of Object.entries(settings)){if(id==='depth')button(id).value=String(value);else button(id).checked=value;}}
 resetComparison();comparisonHint();}
function customComparison(){button('comparison').value='custom';resetComparison();comparisonHint();}
function playComparison(){resetComparison();audioReady();motion.playReference();applyTarget();audioCursor=0;lab.comparisonRun={preset:selectedComparison()?.id??'custom',cycles:1,completed:0,done:false};}
button('comparison').onchange=selectComparison;
button('scene').onchange=()=>{resetComparison();comparisonHint();};
button('combo').onclick=()=>{if(combo.active){cancelComparison('manual');return;}resetComparison();audioReady();combo.start();lab.timeline.push({text:'预置'+{standing:'站立',air:'浮空',down:'倒地',rise:'起身'}[motion.target.state],event:'fixture'});renderTimeline();};
function renderTimeline(){const fragments=document.createDocumentFragment();for(const entry of lab.timeline){const span=document.createElement('span');span.textContent=entry.text;fragments.append(span);}button('comboTimeline').replaceChildren(fragments);}
function trackCombo(){if(!combo.run)return;let changed=false;
 for(const e of motion.events.slice(timelineCursor)){let text=e.type==='impact'?{standing:'站立受击',air:'浮空受击',down:'倒地追击',rise:'起身受击'}[e.victimState]:{'victim-land':'落地','forced-stand':'保护起身','victim-rise':'普通起身','victim-standing':'站稳','victim-defeat':'致死','combo-demo-done':'连招结束'}[e.type];
  if(text){lab.timeline.push({text,event:e.type,attackId:e.attackId,feedbackTime:motion.feedbackTime});changed=true;}}
 timelineCursor=motion.events.length;if(changed)renderTimeline();button('combo').textContent=combo.active?'停止连招':'完整连招';}
let audioContext=null,audioCursor=0;
lab.audio={played:0,scheduled:[],error:null};
function audioReady(){if(!button('sound').checked)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().catch(e=>{lab.audio.error=e.message;});}catch(e){lab.audio.error=e.message;}}
function pumpAudio(){while(audioCursor<motion.events.length){const e=motion.events[audioCursor++];if(e.type!=='impact'||!e.feedbackEnabled||!button('sound').checked||audioContext?.state!=='running')continue;
 const samples=summonerImpactSamples(e.stage,audioContext.sampleRate),buffer=audioContext.createBuffer(1,samples.length,audioContext.sampleRate);buffer.copyToChannel(samples,0);const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);source.onended=()=>source.disconnect();source.start();lab.audio.played++;lab.audio.scheduled.push({attackId:e.attackId,stage:e.stage,samples:samples.length});}
 lab.audio.contextState=audioContext?.state??'not-created';}
function applyTarget(){motion.target.present=!button('empty').checked;motion.target.lane=button('lane').checked?24:+button('depth').value;motion.setFeedbackEnabled(button('feedback').checked);motion.setTargetKind(button('pk').checked?'player':'monster');motion.setArmored(button('armor').checked);motion.setPKProtection(button('protect').checked);motion.setLegacyContact(!button('outline').checked);}
for(const id of ['fragile','pk','empty','lane','feedback','armor','protect','outline'])button(id).onchange=customComparison;
button('depth').oninput=customComparison;
button('edge').onclick=()=>{button('scene').value='standing';button('comparison').value='custom';button('depth').value='0';for(const id of ['fragile','empty','lane','armor','protect'])button(id).checked=false;button('feedback').checked=true;resetComparison();motion.playContactEdge();applyTarget();button('frame').value='11';button('frameLabel').value='11';comparisonHint();lab.draw();};
button('sound').onchange=audioReady;

button('attack').addEventListener('pointerdown',e=>{e.preventDefault();cancelComparison();audioReady();button('attack').setPointerCapture(e.pointerId);motion.setHeld(true);});
for(const event of ['pointerup','pointercancel','lostpointercapture'])button('attack').addEventListener(event,()=>motion.setHeld(false));
button('replay').onclick=playComparison;button('reset').onclick=resetComparison;button('face').onclick=()=>{cancelComparison();motion.face(-motion.facing);motion.placeTargetInFront();};
button('frame').oninput=e=>{cancelComparison();motion.seekFrame(+e.target.value);button('frameLabel').value=e.target.value;lab.draw();};
button('resume').onclick=resetComparison;
addEventListener('keydown',e=>{if(['INPUT','BUTTON','SELECT'].includes(e.target.tagName))return;if(['x','a','d','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(!keys.has(e.key)&&e.key==='x'){cancelComparison();audioReady();motion.setHeld(true);}keys.add(e.key);}});
addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='x')motion.setHeld(false);});
const release=cancelComparison;addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release();});
let last=null,recorder=null,chunks=[],stream=null;
button('record').onclick=()=>{if(recorder?.state==='recording'){recorder.stop();return;}
 try{stream=canvas.captureStream(30);const mime=['video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType})),a=document.createElement('a');a.href=url;a.download='summoner-s9-canvas.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);stream.getTracks().forEach(t=>t.stop());button('record').textContent='录制动作';};recorder.start(250);button('record').textContent='停止并下载';}catch(e){button('status').textContent='录制不可用：'+e.message;}};
function raf(now){const dt=summonerFrameDelta(now,last);last=now;const slow=button('slow').checked?.25:1;
 const dir=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);if(dir)motion.move(dir*95*dt*slow);
 if(combo.active)combo.tick(dt*slow);else motion.tick(dt*slow);trackCombo();const run=lab.comparisonRun;if(run&&!run.done){const completed=motion.events.filter(e=>e.type==='reference-done').length;if(completed>run.completed){run.completed=completed;if(completed<run.cycles){motion.replay=true;motion.start(0);}else run.done=true;}}
 pumpAudio();lab.draw();if(lab.victimFrames&&lab.victimFrames.length<1000)lab.victimFrames.push({phase:motion.targetPose().phase,pose:motion.targetPose(),stop:motion.target.stop,time:motion.feedbackTime});const a=motion.action;button('status').textContent=motion.paused?'逐帧预览 · 按“恢复操作”继续':a?['首段 · 前伸','第二段 · 斜向上挥','末段 · 空中收杖'][a.stage]:'等待输入 · X / 长按攻击';if(combo.active)button('status').textContent+=` · ${combo.run.phase==='approach'?'自动近身':combo.run.phase==='settle'?'等待状态接续':'第'+combo.run.cycle+'套'}`;button('status').textContent+=` · 命中 ${motion.hitCount} · ${{idle:'站立',impact:'冲击',hold:'硬直',recover:'恢复','air-rise':'上升','air-fall':'下落','air-hit':'空中受击',down:'倒地','down-hit':'倒地受击',landing:'落地',rise:'起身','defeat-hit':'致死受击','defeat-fall':'死亡下落','defeat-down':'死亡倒地'}[motion.targetPose().phase]}`;
 if(lab.samples.length<5000)lab.samples.push({wall:now,time:motion.time,feedbackTime:motion.feedbackTime,stop:motion.attackerStop,targetX:motion.target.x,targetAge:motion.target.reaction?.age??null,stage:a?.stage??null,frame:a?.frame??null,held:motion.held});requestAnimationFrame(raf);}
selectComparison();requestAnimationFrame(raf);
</script></body></html>
